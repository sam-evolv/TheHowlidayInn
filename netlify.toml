[build]
  command = "npm run build:netlify"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy API requests to the Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA catch-all (must be AFTER the API proxy)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
